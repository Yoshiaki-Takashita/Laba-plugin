<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 416" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<desc>共同訴訟の三類型は、訴訟共同の必要と合一確定の必要という二つの観点の組合せで決まる。</desc>
<defs><marker id="ah-k" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#1A1A1A" stroke-width="1.3"/></marker><marker id="ah-a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#943522" stroke-width="1.3"/></marker><marker id="ah-g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#8C9493" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="1040" height="416" fill="#FFFFFF" stroke="none"/>
<text x="604.5" y="51" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">訴訟共同の必要</text>
<text x="401.8" y="82.5" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">ない</text>
<text x="807.3" y="82.5" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">ある</text>
<text x="30" y="51" font-size="21" text-anchor="start" fill="#1A1A1A">合一確定の必要</text>
<rect x="199" y="96.5" width="811" height="288.9" fill="none" stroke="#1A1A1A" stroke-width="0.9"/>
<line x1="604.5" y1="96.5" x2="604.5" y2="385.4" fill="none" stroke="#1A1A1A" stroke-width="0.9"/>
<line x1="199" y1="255.5" x2="1010" y2="255.5" fill="none" stroke="#1A1A1A" stroke-width="0.9"/>
<text x="103.5" y="183.7" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">ある</text>
<text x="401.8" y="137.7" font-size="24" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">類似必要的共同訴訟</text>
<text x="401.8" y="171.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A"><tspan x="401.8" dy="0">一人でも訴えられる</tspan><tspan x="401.8" dy="29">共同で訴えた以上は</tspan><tspan x="401.8" dy="29">判決をそろえる（40条）</tspan></text>
<rect x="610.5" y="102.5" width="393.5" height="147" fill="none" stroke="#943522" stroke-width="2.5"/>
<text x="807.3" y="152.2" font-size="24" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">固有必要的共同訴訟</text>
<text x="807.3" y="185.8" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A"><tspan x="807.3" dy="0">全員がそろわなければ却下</tspan><tspan x="807.3" dy="29">判決もそろえる（40条）</tspan></text>
<text x="103.5" y="328.2" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">ない</text>
<text x="401.8" y="296.7" font-size="24" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">通常共同訴訟</text>
<text x="401.8" y="330.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A"><tspan x="401.8" dy="0">各自が独立に訴訟を追行する（39条）</tspan><tspan x="401.8" dy="29">判決が分かれてもよい</tspan></text>
<text x="807.3" y="296.7" font-size="24" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">この組合せはない</text>
<text x="807.3" y="330.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A"><tspan x="807.3" dy="0">全員の関与を求めるなら、</tspan><tspan x="807.3" dy="29">判決もそろえることになる（補足）</tspan></text>
</svg>
