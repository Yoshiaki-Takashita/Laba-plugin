<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 345" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
<desc>共有物をめぐる訴えは、誰が誰を訴えるか、何を求めるかによって、共有者全員が当事者になる必要があるかが分かれる。</desc>
<defs><marker id="ah-k" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#1A1A1A" stroke-width="1.3"/></marker><marker id="ah-a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#943522" stroke-width="1.3"/></marker><marker id="ah-g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12.5" refY="6" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#8C9493" stroke-width="1.3"/></marker></defs>
<rect x="0" y="0" width="1040" height="345" fill="#FFFFFF" stroke="none"/>
<line x1="30" y1="30" x2="1010" y2="30" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="125" y="59.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">訴えの向き</text>
<text x="417.5" y="59.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">各自の持分権に基づく請求</text>
<text x="812.5" y="59.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">共有関係そのものについての請求</text>
<line x1="30" y1="73" x2="1010" y2="73" fill="none" stroke="#1A1A1A" stroke-width="0.9"/>
<text x="125" y="106.3" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A"><tspan x="125" dy="0">共有者から</tspan><tspan x="125" dy="29">第三者へ</tspan></text>
<text x="236" y="104.8" font-size="21" text-anchor="start" fill="#1A1A1A"><tspan x="236" dy="0">各共有者が単独でできる</tspan><tspan x="236" dy="29">例：不実の登記の抹消を求める</tspan></text>
<rect x="619" y="78" width="387" height="70" fill="none" stroke="#943522" stroke-width="2.5"/>
<text x="631" y="104.8" font-size="21" text-anchor="start" fill="#1A1A1A"><tspan x="631" dy="0">共有者全員が原告になる</tspan><tspan x="631" dy="29">例：共有権の確認を求める</tspan></text>
<line x1="30" y1="153" x2="1010" y2="153" fill="none" stroke="#8C9493" stroke-width="0.9"/>
<text x="125" y="200.7" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A">共有者どうし</text>
<text x="236" y="184.8" font-size="21" text-anchor="start" fill="#1A1A1A"><tspan x="236" dy="0">争っている当事者の間で足りる</tspan><tspan x="236" dy="29">例：持分の確認を求める</tspan></text>
<rect x="619" y="158" width="387" height="70" fill="none" stroke="#943522" stroke-width="2.5"/>
<text x="631" y="184.8" font-size="21" text-anchor="start" fill="#1A1A1A"><tspan x="631" dy="0">共有者全員が当事者になる</tspan><tspan x="631" dy="29">例：共有物の分割を求める</tspan></text>
<line x1="30" y1="233" x2="1010" y2="233" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
<line x1="30" y1="251" x2="1010" y2="251" fill="none" stroke="#8C9493" stroke-width="0.9"/>
<text x="30" y="281" font-size="21" text-anchor="start" fill="#1A1A1A"><tspan x="30" dy="0">どの判例がどの欄に入るかは、資料の判例を一件ずつ確かめてから書く。</tspan><tspan x="30" dy="29">確かめていない判例を欄に入れない。</tspan></text>
</svg>
