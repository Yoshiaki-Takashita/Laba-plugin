<text x="645.8" y="311.8" font-size="21" text-anchor="middle" style="text-anchor:middle" fill="#1A1A1A"><tspan x="645.8" dy="0">監査役か</tspan><tspan x="645.8" dy="29">会計参与を置く</tspan></text>
